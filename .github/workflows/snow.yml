name: 산행계획 리포트

on:
  # 실행 시각은 cron-job.org가 GitHub API로 깨워서 정함 (GitHub 자체 예약은 자주 늦거나 빠져서 사용 안 함)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hikeplan
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: 적설·예보 조회
        env:
          KMA_AUTH_KEY: ${{ secrets.KMA_AUTH_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}   # 한국관광공사 관광사진 (없으면 위키미디어만 사용)
        run: |
          mkdir -p site
          python snow_report.py --csv top20_snow_mountains.csv --report-dir site --out site/snow_latest.csv
          cp site/snow_latest.html site/index.html
          python challenge_report.py --csv challenges.csv --report-dir site || echo "챌린지 탭 생성 실패(설산 페이지는 그대로 배포)"
          cp -r routes site/routes || echo "램블러 캡처 폴더 없음"

      - name: 결과 파일 보관(30일)
        uses: actions/upload-artifact@v4
        with:
          name: hikeplan
          path: site/
          retention-days: 30

      - name: Pages 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Pages 배포
        id: deploy
        continue-on-error: true      # 실패해도 아래에서 한 번 더 시도
        uses: actions/deploy-pages@v4

      - name: 배포 실패 시 1분 대기
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - name: Pages 배포 재시도
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
